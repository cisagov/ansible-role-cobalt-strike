---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Only Debian-based platforms are currently supported.
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-amazonlinux2023-ansible:latest
  #   name: amazonlinux2023-systemd-amd64
  #   platform: amd64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-amazonlinux2023-ansible:latest
  #   name: amazonlinux2023-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # yamllint complains about a long line in this comment, but I don't
  # want to break it up because I am quoting verbatim the output of
  # ./teamserver.  This is the reason for the yamllint disable
  # directive below.
  #
  # yamllint disable rule:line-length
  # The latest version of CobaltStrike requires glibc 2.29, which is
  # unavailable for Debian Buster.  When one attempts to start the
  # teamserver on Buster one gets the following output:
  #
  # root@debian10:/# cd /opt/cobaltstrike/
  # root@debian10:/opt/cobaltstrike# ./teamserver
  #
  # [*] Checking TeamServerImage for local update
  #
  # [*] Verifying MD5 Message Digest for TeamServerImage
  # TeamServerImage: OK
  #
  # [*] Will use existing X509 certificate and keystore (for SSL)
  #
  # [*] Starting teamserver
  # ./TeamServerImage: /lib/x86_64-linux-gnu/libm.so.6: version `GLIBC_2.29' not found (required by ./TeamServerImage)
  #
  # yamllint enable rule:line-length
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-debian10-ansible:latest
  #   name: debian10-systemd-amd64
  #   platform: amd64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-debian10-ansible:latest
  #   name: debian10-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - cgroupns_mode: host
    command: /lib/systemd/systemd
    image: docker.io/geerlingguy/docker-debian11-ansible:latest
    name: debian11-systemd-amd64
    platform: amd64
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CobaltStrike does not support ARM64:
  # https://github.com/cisagov/ansible-role-cobalt-strike/pull/85#issuecomment-2171882459
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-debian11-ansible:latest
  #   name: debian11-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - cgroupns_mode: host
    command: /lib/systemd/systemd
    image: docker.io/geerlingguy/docker-debian12-ansible:latest
    name: debian12-systemd-amd64
    platform: amd64
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CobaltStrike does not support ARM64:
  # https://github.com/cisagov/ansible-role-cobalt-strike/pull/85#issuecomment-2171882459
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-debian12-ansible:latest
  #   name: debian12-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - cgroupns_mode: host
    command: /lib/systemd/systemd
    image: docker.io/cisagov/docker-debian13-ansible:latest
    name: debian13-systemd-amd64
    platform: amd64
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CobaltStrike does not support ARM64:
  # https://github.com/cisagov/ansible-role-cobalt-strike/pull/85#issuecomment-2171882459
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/cisagov/docker-debian13-ansible:latest
  #   name: debian13-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - cgroupns_mode: host
    command: /lib/systemd/systemd
    image: docker.io/cisagov/docker-kali-ansible:latest
    name: kali-systemd-amd64
    platform: amd64
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CobaltStrike does not support ARM64:
  # https://github.com/cisagov/ansible-role-cobalt-strike/pull/85#issuecomment-2171882459
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/cisagov/docker-kali-ansible:latest
  #   name: kali-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # Only Debian-based platforms are currently supported.
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-fedora41-ansible:latest
  #   name: fedora41-systemd-amd64
  #   platform: amd64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-fedora41-ansible:latest
  #   name: fedora41-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # Only Debian-based platforms are currently supported.
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-fedora42-ansible:latest
  #   name: fedora42-systemd-amd64
  #   platform: amd64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-fedora42-ansible:latest
  #   name: fedora42-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - cgroupns_mode: host
    command: /lib/systemd/systemd
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible:latest
    name: ubuntu-22-systemd-amd64
    platform: amd64
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CobaltStrike does not support ARM64:
  # https://github.com/cisagov/ansible-role-cobalt-strike/pull/85#issuecomment-2171882459
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-ubuntu2204-ansible:latest
  #   name: ubuntu-22-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - cgroupns_mode: host
    command: /lib/systemd/systemd
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    name: ubuntu-24-systemd-amd64
    platform: amd64
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CobaltStrike does not support ARM64:
  # https://github.com/cisagov/ansible-role-cobalt-strike/pull/85#issuecomment-2171882459
  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
  #   name: ubuntu-24-systemd-arm64
  #   platform: arm64
  #   pre_build_image: true
  #   privileged: true
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      # Molecule used to add ${MOLECULE_PROJECT_DIRECTORY}/. to this
      # path for us pre-25.2.0, but now we have to do it ourselves.
      # See ansible/molecule#4380 and
      # https://github.com/ansible/molecule/releases/tag/v25.2.0 for
      # more details.
      roles_path: ~/.cache/molecule/skeleton-ansible-role/${MOLECULE_SCENARIO_NAME}/roles:${MOLECULE_PROJECT_DIRECTORY}/..:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
verifier:
  name: testinfra
